name: iOS App Store Build

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: macOS runner label with Xcode 26+ and iOS 26 SDK
        required: true
        default: macos-26
      xcode_developer_dir:
        description: Xcode developer directory
        required: true
        default: /Applications/Xcode.app/Contents/Developer
      signing_mode:
        description: Build validation or App Store signed export/upload
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - app-store-export
          - app-store-upload

permissions:
  contents: read

env:
  APP_PROJECT: ios/App/App.xcodeproj
  APP_SCHEME: App
  APP_ARCHIVE_PATH: ${{ runner.temp }}/Talepet.xcarchive
  APP_EXPORT_PATH: ${{ runner.temp }}/TalepetExport
  BUNDLE_ID: com.talepet.app
  XCODE_DEVELOPER_DIR: ${{ inputs.xcode_developer_dir }}

jobs:
  ios:
    name: iOS archive
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Verify Xcode major version
        run: |
          VERSION="$(xcodebuild -version | awk '/Xcode/{print $2}')"
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" -lt 26 ]; then
            echo "Xcode 26+ is required. Found: $VERSION"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend and Capacitor dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify App Store constants
        run: |
          grep -q '"appId": "com.talepet.app"' capacitor.config.json
          grep -q '"appName": "Talepet"' capacitor.config.json
          grep -q 'VITE_API_URL=https://api.talepet.net.tr/api' frontend/.env.production
          plutil -extract CFBundleDisplayName raw ios/App/App/Info.plist | grep -q '^Talepet$'
          plutil -extract ITSAppUsesNonExemptEncryption raw ios/App/App/Info.plist | grep -q '^0$'

      - name: Build without signing
        if: ${{ inputs.signing_mode == 'build-only' }}
        run: |
          xcodebuild build \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Apple signing assets
        if: ${{ inputs.signing_mode != 'build-only' }}
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ] || [ -z "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_APP_STORE_PROFILE_BASE64" ]; then
            echo "Missing signing secrets. Required: IOS_DISTRIBUTION_CERTIFICATE_BASE64, IOS_DISTRIBUTION_CERTIFICATE_PASSWORD, IOS_APP_STORE_PROFILE_BASE64"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)"
          PROFILE_NAME="$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive for App Store
        if: ${{ inputs.signing_mode != 'build-only' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing APPLE_TEAM_ID secret."
            exit 1
          fi

          xcodebuild archive \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$APP_ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Prepare export options
        if: ${{ inputs.signing_mode != 'build-only' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cp ios/App/ExportOptions.app-store.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$BUNDLE_ID $IOS_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        if: ${{ inputs.signing_mode != 'build-only' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$APP_ARCHIVE_PATH" \
            -exportPath "$APP_EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        if: ${{ inputs.signing_mode != 'build-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: Talepet-AppStore-IPA
          path: ${{ env.APP_EXPORT_PATH }}/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: ${{ inputs.signing_mode == 'app-store-upload' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "Missing App Store Connect secrets. Required: APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_KEY_BASE64"
            exit 1
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          IPA_PATH="$(find "$APP_EXPORT_PATH" -name '*.ipa' -print -quit)"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
